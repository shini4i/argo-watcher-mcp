name: Go Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.go'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        # v7.0.0 or newer is required: earlier releases fetch Codecov's GPG key
        # from the `codecovsecurity` keybase account, which Codecov has deleted.
        # The wrapper then cannot verify the CLI it downloaded and exits 1.
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-tests
          fail_ci_if_error: true
