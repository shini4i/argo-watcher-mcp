name: Go Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.go'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Go
        uses: actions/setup-go@cdcb36043654635271a94b9a6d1392de5bb323a7 # v5.0.1
        with:
          go-version: "1.25"
          cache: true

      - name: Run unit tests
        run: go test ./...
