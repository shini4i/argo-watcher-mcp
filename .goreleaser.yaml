project_name: argo-watcher-mcp

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: argo-watcher-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

dockers:
  - image_templates:
      - ghcr.io/shini4i/argo-watcher-mcp:{{ .Version }}-linux-amd64
      - ghcr.io/shini4i/argo-watcher-mcp:latest-linux-amd64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --pull
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.version={{ .Version }}
    ids:
      - server
  - image_templates:
      - ghcr.io/shini4i/argo-watcher-mcp:{{ .Version }}-linux-arm64
      - ghcr.io/shini4i/argo-watcher-mcp:latest-linux-arm64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --pull
      - --label=org.opencontainers.image.created={{ .Date }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.version={{ .Version }}
    ids:
      - server

docker_manifests:
  - name_template: ghcr.io/shini4i/argo-watcher-mcp:{{ .Version }}
    image_templates:
      - ghcr.io/shini4i/argo-watcher-mcp:{{ .Version }}-linux-amd64
      - ghcr.io/shini4i/argo-watcher-mcp:{{ .Version }}-linux-arm64
  - name_template: ghcr.io/shini4i/argo-watcher-mcp:latest
    image_templates:
      - ghcr.io/shini4i/argo-watcher-mcp:latest-linux-amd64
      - ghcr.io/shini4i/argo-watcher-mcp:latest-linux-arm64

archives:
  - format: tar.gz
    builds:
      - server

checksum:
  name_template: checksums.txt

changelog:
  use: git
