version: 2

project_name: argo-watcher-mcp

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod tidy

builds:
  - id: server
    main: ./cmd/server
    binary: argo-watcher-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      # Stamp the release version into the binary so it reports itself correctly
      # over MCP without the operator setting APP_VERSION. GoReleaser's default
      # ldflags target main.version, which this project does not use — the
      # version lives with the rest of the configuration defaults.
      - -s -w -X github.com/shini4i/argo-watcher-mcp/internal/config.defaultVersion={{ .Version }}

# dockers_v2 builds one multi-platform image and pushes the tags below, which
# replaces the previous pair of per-arch `dockers` entries plus the
# `docker_manifests` that stitched them together.
dockers_v2:
  - images:
      - ghcr.io/shini4i/argo-watcher-mcp
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Dockerfile
    ids:
      - server
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

checksum:
  name_template: checksums.txt

changelog:
  use: git
