version: "3"

vars:
  GOMODCACHE: "{{.ROOT_DIR}}/.cache/gomod"
  GOCACHE: "{{.ROOT_DIR}}/.cache/gocache"
  OUTPUT_DIR: "{{.ROOT_DIR}}/bin"
  BINARY: "argo-watcher-mcp"

tasks:
  setup:
    desc: "Prepare Go build caches"
    cmds:
      - mkdir -p {{.GOMODCACHE}} {{.GOCACHE}}

  tidy:
    desc: "Tidy Go module dependencies"
    deps: [setup]
    cmds:
      - GOMODCACHE={{.GOMODCACHE}} GOCACHE={{.GOCACHE}} go mod tidy

  fmt:
    desc: "Format Go sources"
    cmds:
      - gofmt -w ./cmd ./internal

  vet:
    desc: "Run go vet"
    deps: [setup]
    cmds:
      - GOMODCACHE={{.GOMODCACHE}} GOCACHE={{.GOCACHE}} go vet ./...

  test:
    desc: "Run unit tests"
    deps: [setup]
    cmds:
      - GOMODCACHE={{.GOMODCACHE}} GOCACHE={{.GOCACHE}} go test ./...

  build:
    desc: "Build the server binary"
    deps: [setup]
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
      - GOMODCACHE={{.GOMODCACHE}} GOCACHE={{.GOCACHE}} go build -o {{.OUTPUT_DIR}}/{{.BINARY}} ./cmd/server

  run:
    desc: "Run the MCP server (stdio + HTTP)"
    deps: [setup]
    cmds:
      - GOMODCACHE={{.GOMODCACHE}} GOCACHE={{.GOCACHE}} go run ./cmd/server

  clean:
    desc: "Remove build artefacts"
    cmds:
      - rm -rf {{.OUTPUT_DIR}}

  release:snapshot:
    desc: "Run GoReleaser snapshot (dry-run) build"
    deps: [build]
    cmds:
      - goreleaser release --snapshot --clean
